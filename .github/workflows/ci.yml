name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            lua5.4 liblua5.4-dev libssl-dev libexpat1-dev libicu-dev \
            lua-socket lua-expat lua-filesystem lua-sec \
            lua-busted lua-check gcc make

      - name: Configure
        run: ./configure --lua-version=5.4

      - name: Build
        run: make

      - name: Run tests
        run: busted --helper loader --lua=lua5.4

      - name: Lint changed Lua files
        env:
          BASE_REF: refs/tags/13.0.7
        run: |
          files=$(git diff --name-only "$BASE_REF"..."$GITHUB_SHA" -- '*.lua' ':(exclude)*.cfg.lua' ':(exclude)*.cfg.lua.*' || true)
          if [ -n "$files" ]; then
            mapfile -t lua_files <<< "$files"
            luacheck "${lua_files[@]}"
          else
            echo "No changed Lua files to lint"
          fi

  container:
    name: Container build and scan
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

      - name: Set up buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: prosodyx:ci
          build-args: |
            VERSION=ci
            REVISION=${{ github.sha }}
            CREATED=1970-01-01T00:00:00Z

      - name: Smoke test
        run: bash scripts/smoke-test.sh prosodyx:ci

      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: prosodyx:ci
          format: cyclonedx-json
          upload-artifact: false

      - name: Vulnerability scan
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: prosodyx:ci
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          vex: |
            vex/prosodyx.openvex.json
