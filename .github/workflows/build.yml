name: Build release artifacts

on:
  workflow_call:
    inputs:
      version:
        description: "Release version, for example 13.0.7-quad4.1"
        required: true
        type: string
    outputs:
      image-digest:
        description: "Digest of the pushed container image"
        value: ${{ jobs.image.outputs.digest }}

permissions: {}

jobs:
  source:
    name: Source tarball and SBOM
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read # checkout
      id-token: write # keyless signing
      attestations: write # store provenance attestation
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create source tarball
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          git archive --prefix="prosodyx-${VERSION}/" HEAD | gzip -n > "prosodyx-${VERSION}-source.tar.gz"
          sha256sum "prosodyx-${VERSION}-source.tar.gz" > "prosodyx-${VERSION}-source.tar.gz.sha256"

      - name: Generate source SBOM
        env:
          VERSION: ${{ inputs.version }}
        run: |
          scripts/gen-sbom.sh > "prosodyx-${VERSION}-sbom.cyclonedx.json"

      - name: Attest source tarball
        id: attest-source
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: prosodyx-${{ inputs.version }}-source.tar.gz
          provenance-name: prosodyx-${{ inputs.version }}-source-provenance

      - name: Keep provenance bundle
        env:
          VERSION: ${{ inputs.version }}
          BUNDLE: ${{ steps.attest-source.outputs.bundle-path }}
        run: |
          cp "$BUNDLE" "prosodyx-${VERSION}-source.tar.gz.provenance.jsonl"

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prosodyx-${{ inputs.version }}-source
          path: |
            prosodyx-${{ inputs.version }}-source.tar.gz
            prosodyx-${{ inputs.version }}-source.tar.gz.sha256
            prosodyx-${{ inputs.version }}-sbom.cyclonedx.json
            prosodyx-${{ inputs.version }}-source.tar.gz.provenance.jsonl
          retention-days: 5

  image:
    name: Container image
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read # checkout
      packages: write # push image and signatures to ghcr.io
      id-token: write # keyless signing
      attestations: write # store provenance attestation
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/quad4-software/prosodyx
          tags: |
            type=raw,value=${{ inputs.version }}
            type=raw,value=latest

      - name: Commit timestamp
        id: ts
        run: |
          epoch=$(git log -1 --format=%ct)
          echo "epoch=$epoch" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u -d "@$epoch" +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          build-args: |
            VERSION=${{ inputs.version }}
            REVISION=${{ github.sha }}
            CREATED=${{ steps.ts.outputs.created }}
            SOURCE_DATE_EPOCH=${{ steps.ts.outputs.epoch }}
          rewrite-timestamp: true

      - name: Sign image
        run: |
          cosign sign --yes "${IMAGE}@${DIGEST}"
        env:
          IMAGE: ghcr.io/quad4-software/prosodyx
          DIGEST: ${{ steps.push.outputs.digest }}

      - name: Generate image SBOM (CycloneDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ghcr.io/quad4-software/prosodyx@${{ steps.push.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json
          upload-artifact: false

      - name: Merge source dependencies into SBOM
        env:
          VERSION: ${{ inputs.version }}
        run: |
          scripts/gen-sbom.sh --merge sbom.cyclonedx.json > "prosodyx-${VERSION}-sbom.cyclonedx.json"

      - name: Generate image SBOM (SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ghcr.io/quad4-software/prosodyx@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: prosodyx-${{ inputs.version }}-sbom.spdx.json
          upload-artifact: false

      - name: Attest SBOMs and VEX
        env:
          IMAGE: ghcr.io/quad4-software/prosodyx
          DIGEST: ${{ steps.push.outputs.digest }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          cosign attest --yes --type cyclonedx \
            --predicate "prosodyx-${VERSION}-sbom.cyclonedx.json" \
            "${IMAGE}@${DIGEST}"
          cosign attest --yes --type spdxjson \
            --predicate "prosodyx-${VERSION}-sbom.spdx.json" \
            "${IMAGE}@${DIGEST}"
          cosign attest --yes --type openvex \
            --predicate vex/prosodyx.openvex.json \
            "${IMAGE}@${DIGEST}"

      - name: Attest image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/quad4-software/prosodyx
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Attest SBOM attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        id: attest-sbom
        with:
          subject-name: ghcr.io/quad4-software/prosodyx
          subject-digest: ${{ steps.push.outputs.digest }}
          predicate-type: https://spdx.dev/Document
          predicate-path: prosodyx-${{ inputs.version }}-sbom.spdx.json
          push-to-registry: true

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prosodyx-${{ inputs.version }}-image-sbom
          path: |
            prosodyx-${{ inputs.version }}-sbom.cyclonedx.json
            prosodyx-${{ inputs.version }}-sbom.spdx.json
          retention-days: 5
